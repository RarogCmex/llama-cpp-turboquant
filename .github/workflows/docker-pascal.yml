name: Build CUDA Pascal Docker image

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA version"
        type: string
        default: "12.9.1"

concurrency:
  group: docker-pascal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  build-and-push:
    name: Build CUDA ${{ inputs.cuda_version }} for Pascal
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Free disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          file: .devops/cuda.Dockerfile
          target: full
          provenance: false
          build-args: |
            CUDA_VERSION=${{ inputs.cuda_version }}
            CUDA_DOCKER_ARCH=6.0;6.1
            BUILD_DATE=${{ steps.build_date.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/llama-cpp-turboquant:cuda${{ inputs.cuda_version }}-pascal

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            /user/packages/container/${{ github.event.repository.name }} \
            -f visibility=public